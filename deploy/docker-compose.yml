services:
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pom:${POSTGRES_PASSWORD}@db:5432/pom
      SECRET_KEY: ${SECRET_KEY}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
    volumes:
      - uploads:/data/uploads
      - backups:/data/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - internal

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pom
      POSTGRES_USER: pom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 数据库端口不对公网映射（PRD 9.3 安全门槛）
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pom -d pom"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backup:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/data/backups
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "while true; do /usr/local/bin/backup.sh || true; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  pgdata:
  uploads:
  backups:

networks:
  internal:
    driver: bridge
